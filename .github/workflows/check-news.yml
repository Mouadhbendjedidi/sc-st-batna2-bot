name: Check University News

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours
  workflow_dispatch:  # lets you trigger it manually from GitHub UI too

permissions:
  contents: write  # needed to commit last_seen.json back

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python script.py

      - name: Commit updated last_seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen.json
          git diff --staged --quiet || git commit -m "Update seen posts"
          git push
